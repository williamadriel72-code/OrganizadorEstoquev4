<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Voa Michael • APK Teste AWS</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}button,select{font:inherit}.hidden{display:none!important}.wrap{max-width:760px;margin:auto;padding:12px}.top{position:sticky;top:0;z-index:20;background:#071018ee;backdrop-filter:blur(12px);border-bottom:1px solid #203040}.topin{max-width:760px;margin:auto;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:950}.sub,.muted{color:#91a1b4;font-size:12px}.pill{background:#12301d;color:#86efac;border:1px solid #24663a;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.card{background:#101a24;border:1px solid #203040;border-radius:17px;padding:14px;margin:10px 0}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(440px,100%)}select{width:100%;background:#08111a;color:#fff;border:1px solid #304257;border-radius:12px;padding:12px;margin:12px 0}.btn{border:0;border-radius:12px;padding:11px 13px;background:#27384a;color:#fff;font-weight:850;cursor:pointer}.primary{background:#16a34a}.blue{background:#2563eb}.orange{background:#d97706}.danger{background:#b91c1c}.wide{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.money{font-size:26px;font-weight:950;color:#86efac}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0a141e;border:1px solid #203040;border-radius:13px;padding:11px}.stat b{display:block;font-size:20px}.order{background:#0c1620;border:1px solid #25374a;border-radius:15px;padding:13px;margin:9px 0}.order.done{opacity:.65}.n{display:grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:#2563eb;font-weight:950}.oid{font-size:17px;font-weight:950}.name{font-weight:850;margin-top:8px}.addr{font-size:13px;color:#d5dee8;line-height:1.35;margin-top:4px}.bairro{display:inline-flex;margin-top:7px;border-radius:99px;padding:4px 8px;background:#1d2a38;color:#bae6fd;font-size:11px;font-weight:800}.fee{color:#86efac;font-weight:900}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1}.msg{font-size:12px;color:#fca5a5;margin-top:8px}.empty{text-align:center;color:#91a1b4;padding:26px 8px}.routeInfo{font-size:12px;color:#93c5fd;margin-top:8px}.sep{height:1px;background:#203040;margin:14px 0}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.topin{align-items:flex-start}.actions{flex-direction:column}.money{font-size:23px}}</style></head><body>
<div id="login" class="login"><div class="card"><div class="brand">Voa Michael</div><div class="sub">APK TESTE AWS • selecione seu nome</div><select id="rider"><option>Carregando motoboys...</option></select><button id="enter" class="btn primary wide">Entrar</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><div><div class="brand">Voa Michael <span class="pill">TESTE AWS</span></div><div id="who" class="sub"></div></div><button id="logout" class="btn">Sair</button></div></header><main class="wrap">
<section class="card"><div class="between"><div><div class="sub">GANHOS DAS ENTREGAS RECEBIDAS</div><div id="earn" class="money">R$ 0,00</div></div><button id="refresh" class="btn">Atualizar</button></div><div class="stats"><div class="stat"><span class="sub">Em rota</span><b id="pendingCount">0</b></div><div class="stat"><span class="sub">Concluídas</span><b id="doneCount">0</b></div></div></section>
<section class="card"><div class="between"><div><b>Rota atual</b><div class="sub">A rota só é limpa quando todas forem concluídas.</div></div><button id="sort" class="btn blue">Organizar rota</button></div><div id="routeInfo" class="routeInfo">Aguardando pedidos.</div><button id="maps" class="btn primary wide" style="margin-top:10px">Abrir rota no Google Maps</button></section>
<section class="card"><div class="between"><b>Entregas pendentes</b><span id="sync" class="sub"></span></div><div id="pending"></div><div class="sep"></div><b>Concluídas</b><div id="done"></div></section>
</main></div>
<script>
const API='https://rlgsbtolosxyymosidns.supabase.co/functions/v1/bora-ifood-test-rider';
const RESOLVE='https://rlgsbtolosxyymosidns.supabase.co/functions/v1/voa-address-resolver';
const $=id=>document.getElementById(id);let token=localStorage.getItem('voa_token')||'',rider=JSON.parse(localStorage.getItem('voa_rider')||'null'),orders=[],coords={},timer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function fee(o){const m=String(o.reference||'').match(/Taxa do bairro:\s*R\$\s*([\d.,]+)/i);if(!m)return 0;let s=m[1];if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)||0}
function addr(o){return o.formatted_address||[o.street_name,o.street_number,o.neighborhood,o.city,o.state].filter(Boolean).join(', ')}
async function post(body,auth=true){const h={'content-type':'application/json'};if(auth&&token)h.authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error(j.error||'Sessão expirada')}if(!r.ok)throw new Error(j.error||'Falha de comunicação');return j}
async function riders(){try{const j=await post({action:'list_riders'},false);$('rider').innerHTML='<option value="">Escolha seu nome...</option>'+j.riders.map(x=>`<option value="${esc(x.id)}">${esc(x.nome)}</option>`).join('')}catch(e){$('rider').innerHTML='<option>Falha ao carregar</option>';$('loginMsg').textContent=e.message}}
$('enter').onclick=async()=>{const id=$('rider').value;if(!id)return;$('enter').disabled=true;$('loginMsg').textContent='Entrando...';try{const j=await post({action:'login_name',riderId:id},false);token=j.session_token;rider=j.rider;localStorage.setItem('voa_token',token);localStorage.setItem('voa_rider',JSON.stringify(rider));show();await load()}catch(e){$('loginMsg').textContent=e.message}finally{$('enter').disabled=false}};
function logout(){token='';rider=null;localStorage.removeItem('voa_token');localStorage.removeItem('voa_rider');if(timer)clearInterval(timer);$('app').classList.add('hidden');$('login').classList.remove('hidden');riders()}
$('logout').onclick=logout;
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=rider?.nome||'';if(timer)clearInterval(timer);timer=setInterval(()=>load(true),10000)}
function routeKey(){return 'voa_route_'+(rider?.id||'x')}function getRoute(){try{return JSON.parse(localStorage.getItem(routeKey())||'[]')}catch{return[]}}function saveRoute(a){localStorage.setItem(routeKey(),JSON.stringify(a))}
function card(o,i,isDone=false){const c=coords[o.order_id]||((o.latitude!=null&&o.longitude!=null)?{lat:Number(o.latitude),lon:Number(o.longitude)}:null);return `<article class="order ${isDone?'done':''}"><div class="row"><span class="n">${isDone?'✓':i+1}</span><div><div class="oid">#${esc(o.display_id||String(o.order_id).slice(0,8))}</div><div class="sub">${esc(o.source||'iFood')}</div></div><div style="margin-left:auto" class="fee">${money(fee(o))}</div></div><div class="name">${esc(o.customer_name||'Cliente')}</div><div class="addr">${esc(addr(o)||'Endereço não informado')}</div><span class="bairro">${esc(o.neighborhood||'Bairro não informado')}</span>${c?`<div class="sub" style="margin-top:6px">Localização pronta</div>`:''}${isDone?'':`<div class="actions"><button class="btn nav" data-id="${esc(o.order_id)}">Navegar</button><button class="btn primary finish" data-id="${esc(o.order_id)}">Concluir entrega</button></div>`}</article>`}
function orderedPending(){const p=orders.filter(o=>o.status==='dispatched'),r=getRoute();if(!r.length)return p;const m=new Map(p.map(o=>[o.order_id,o]));const a=r.map(id=>m.get(id)).filter(Boolean);for(const o of p)if(!r.includes(o.order_id))a.push(o);return a}
function render(){const p=orderedPending(),d=orders.filter(o=>o.status==='completed');$('pendingCount').textContent=p.length;$('doneCount').textContent=d.length;$('earn').textContent=money(orders.reduce((s,o)=>s+fee(o),0));$('pending').innerHTML=p.length?p.map((o,i)=>card(o,i)).join(''):'<div class="empty">Nenhuma entrega pendente.</div>';$('done').innerHTML=d.length?d.map((o,i)=>card(o,i,true)).join(''):'<div class="empty">Nenhuma concluída ainda.</div>';$('routeInfo').textContent=p.length?(getRoute().length?'Sequência salva • '+p.length+' parada(s)':'Há '+p.length+' entrega(s). Toque em Organizar rota.'):'Todas as entregas foram concluídas.';if(!p.length)saveRoute([]);document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>navigate(b.dataset.id));document.querySelectorAll('.finish').forEach(b=>b.onclick=()=>complete(b.dataset.id))}
async function load(silent=false){try{if(!silent)$('sync').textContent='Atualizando...';const j=await post({action:'list_orders'});orders=j.orders||[];render();$('sync').textContent='Agora • '+new Date().toLocaleTimeString('pt-BR')}catch(e){$('sync').textContent=e.message}}
$('refresh').onclick=()=>load(false);
function currentPos(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(null);navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),()=>resolve(null),{enableHighAccuracy:true,timeout:7000,maximumAge:60000})})}
async function resolveOrder(o){if(coords[o.order_id])return coords[o.order_id];if(o.latitude!=null&&o.longitude!=null){coords[o.order_id]={lat:Number(o.latitude),lon:Number(o.longitude)};return coords[o.order_id]}const r=await fetch(RESOLVE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({formatted_address:o.formatted_address,street_name:o.street_name,street_number:o.street_number,neighborhood:o.neighborhood,city:o.city||'Macaé',state:o.state||'RJ',zip_code:o.zip_code})});if(!r.ok)return null;const j=await r.json();const c={lat:Number(j.latitude),lon:Number(j.longitude)};if(Number.isFinite(c.lat)&&Number.isFinite(c.lon)){coords[o.order_id]=c;return c}return null}
function dist(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
$('sort').onclick=async()=>{const btn=$('sort'),p=orders.filter(o=>o.status==='dispatched');if(!p.length)return;btn.disabled=true;btn.textContent='Localizando...';try{for(const o of p){if(!(o.latitude!=null&&o.longitude!=null))btn.textContent='Pesquisando '+(o.neighborhood||o.street_name||'endereço')+'...';await resolveOrder(o)}let cur=await currentPos();const left=p.filter(o=>coords[o.order_id]);const missing=p.filter(o=>!coords[o.order_id]);if(!cur&&left.length)cur=coords[left[0].order_id];const seq=[];while(left.length){let bi=0;if(cur){let bd=Infinity;for(let i=0;i<left.length;i++){const d=dist(cur,coords[left[i].order_id]);if(d<bd){bd=d;bi=i}}}const o=left.splice(bi,1)[0];seq.push(o);cur=coords[o.order_id]}seq.push(...missing);saveRoute(seq.map(o=>o.order_id));render()}finally{btn.disabled=false;btn.textContent='Organizar rota'}};
async function navigate(id){const o=orders.find(x=>x.order_id===id);if(!o)return;const c=await resolveOrder(o);const q=c?`${c.lat},${c.lon}`:addr(o);location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
$('maps').onclick=async()=>{let p=orderedPending();if(!p.length)return;if(!getRoute().length){$('sort').click();return}for(const o of p)await resolveOrder(o);p=orderedPending();const stops=p.map(o=>coords[o.order_id]?`${coords[o.order_id].lat},${coords[o.order_id].lon}`:addr(o)).filter(Boolean);if(!stops.length)return;const here=await currentPos();if(stops.length===1){location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(stops[0])+'&travelmode=driving';return}const origin=here?`${here.lat},${here.lon}`:stops[0],destination=stops[stops.length-1],mid=(here?stops.slice(0,-1):stops.slice(1,-1));let url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode=driving';if(mid.length)url+='&waypoints='+encodeURIComponent(mid.join('|'));location.href=url};
async function complete(id){if(!confirm('Marcar esta entrega como concluída?'))return;try{await post({action:'complete_order',orderId:id});await load(false)}catch(e){alert(e.message)}}
if(token&&rider){show();load()}else riders();
</script></body></html>
