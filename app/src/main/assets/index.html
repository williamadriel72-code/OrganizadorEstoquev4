<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>AWS • Bora Michael</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{width:min(420px,100%);background:#101a29;border:1px solid #26364d;border-radius:22px;padding:24px}.brand{font-size:24px;font-weight:900}.muted{margin-top:8px;color:#91a0b5;font-size:13px;line-height:1.45}.btn{margin-top:16px;border:0;border-radius:12px;padding:12px 16px;font-weight:850;background:#16a34a;color:#fff;width:100%}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="brand">AWS • Bora Michael</div><div id="status" class="muted">Carregando interface online...</div><button id="retry" class="btn" style="display:none">Tentar novamente</button></div></div>
<script>
const REMOTE='https://bora-michael-motoboy-vqz606.v2.appdeploy.ai/';
function go(){
  document.getElementById('status').textContent='Carregando interface online...';
  document.getElementById('retry').style.display='none';
  const sep=REMOTE.includes('?')?'&':'?';
  let shell='';
  try{if(window.AndroidApp&&typeof AndroidApp.getAppVersionCode==='function')shell=String(AndroidApp.getAppVersionCode())}catch(e){}
  location.replace(REMOTE+sep+'shell='+encodeURIComponent(shell||'android'));
}
document.getElementById('retry').onclick=go;
setTimeout(()=>{
  if(location.protocol==='file:'){
    document.getElementById('status').textContent='Sem conexão com a interface online. Verifique a internet e tente novamente.';
    document.getElementById('retry').style.display='block';
  }
},8000);
go();
</script>
<script src="bora_auto_update.js"></script>
</body>
</html>
