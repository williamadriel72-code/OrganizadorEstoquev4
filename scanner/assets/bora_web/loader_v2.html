<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e10">
<title>Bora Michael Hi Hi</title>
<style>html,body{margin:0;background:#0c0e10;color:#fff;font-family:system-ui}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.btn{padding:12px 18px;border:0;border-radius:10px}</style>
</head>
<body><div class="load" id="load"><div><b>Carregando Bora Michael Hi Hi...</b><div id="status" style="margin-top:8px;color:#aaa;font-size:13px">Buscando a versão mais recente</div></div></div>
<script>
(async()=>{
 const base='https://raw.githubusercontent.com/williamadriel72-code/OrganizadorEstoquev4/chatgpt-bora-michael-hi-hi/scanner/assets/bora_web';
 try{
  const stamp=Date.now();
  const parts=[];
  for(let i=1;i<=8;i++){
   const r=await fetch(`${base}/part_${String(i).padStart(2,'0')}.txt?v=${stamp}`,{cache:'no-store'});
   if(!r.ok)throw new Error(`parte ${i}: HTTP ${r.status}`);
   parts.push(await r.text());
  }
  let html=parts.join('');
  if(!/<!doctype html/i.test(html)||!/<\/html>/i.test(html))throw new Error('versão incompleta');
  const patchNames=['patch_arrival_v1.js','patch_arrival_rules_v2.js','patch_menu_v1.js','patch_rider_notes_v3.js','patch_admin_refresh_v1.js'];
  const patches=[];
  for(const name of patchNames){
   const r=await fetch(`${base}/${name}?v=${stamp}`,{cache:'no-store'});
   if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);
   patches.push(await r.text());
  }
  const patch=patches.join('\n');
  const marker='\nboot();\n';
  if(!html.includes(marker))throw new Error('ponto de atualização não encontrado');
  html=html.replace(marker,'\n'+patch+'\nboot();\n');
  document.open();document.write(html);document.close();
 }catch(e){
  console.error(e);
  document.getElementById('load').innerHTML=`<div><b>Não foi possível abrir o sistema.</b><br><small style="display:block;margin:10px;color:#aaa">${String(e.message||e)}</small><button class="btn" onclick="location.reload()">Tentar novamente</button></div>`;
 }
})();
</script></body></html>
