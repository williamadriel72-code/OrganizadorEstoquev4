name: Reset numeric users once

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
    paths:
      - ".github/workflows/reset-numeric-users-20260820.yml"
      - "reset_numeric_users_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Executar limpeza unica
        id: reset
        shell: bash
        run: |
          set -euo pipefail
          URL="https://rlgsbtolosxyymosidns.supabase.co/functions/v1/reset-numeric-users-20260820"
          OUT=$(curl -sS -w '\n%{http_code}' "$URL")
          CODE=$(printf '%s' "$OUT" | tail -n1)
          BODY=$(printf '%s' "$OUT" | sed '$d')
          echo "$BODY" > "$RUNNER_TEMP/reset_users_status.txt"
          echo "http=$CODE" >> "$RUNNER_TEMP/reset_users_status.txt"
          cat "$RUNNER_TEMP/reset_users_status.txt"
          test "$CODE" = "200"

      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -u
          FILE="$RUNNER_TEMP/reset_users_status.txt"
          if [ ! -f "$FILE" ]; then echo '{"ok":false,"error":"reset nao executado"}' > "$FILE"; fi
          CONTENT=$(base64 -w0 "$FILE")
          PATH_API="repos/${REPO}/contents/reset_users_status.txt"
          OLD_SHA=$(gh api "$PATH_API?ref=$BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT "$PATH_API" -f message='Atualizar resultado da limpeza de usuarios' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch="$BRANCH" >/dev/null
          else
            gh api --method PUT "$PATH_API" -f message='Registrar resultado da limpeza de usuarios' -f content="$CONTENT" -f branch="$BRANCH" >/dev/null
          fi
