name: Build Bora Michael APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/scanner-build.yml'

jobs:
  build-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Bora Michael assets
        shell: bash
        run: |
          set -e
          mkdir -p scanner/src/main/res/mipmap-xxxhdpi
          mkdir -p scanner/src/main/res/drawable-nodpi
          mkdir -p scanner/src/main/res/raw

          curl -fsSL "https://bora-michael-assets.vercel.app/icon.b64" -o /tmp/bora-icon.b64
          tr -d '\r\n ' < /tmp/bora-icon.b64 | base64 -d > scanner/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat scanner/assets/sticker_1.txt scanner/assets/sticker_2.txt scanner/assets/sticker_3.txt scanner/assets/sticker_4.txt > /tmp/sticker.b64
          tr -d '\r\n ' < /tmp/sticker.b64 | base64 -d > scanner/src/main/res/drawable-nodpi/michael_sticker.webp

          tr -d '\r\n ' < scanner/assets/heehee_mp3.b64 | base64 -d > scanner/src/main/res/raw/heehee.mp3

          file scanner/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file scanner/src/main/res/drawable-nodpi/michael_sticker.webp
          file scanner/src/main/res/raw/heehee.mp3
          test "$(wc -c < scanner/src/main/res/mipmap-xxxhdpi/ic_launcher.png)" -gt 4000
          test "$(wc -c < scanner/src/main/res/drawable-nodpi/michael_sticker.webp)" -gt 2000
          test "$(wc -c < scanner/src/main/res/raw/heehee.mp3)" -gt 2000

      - name: Build Bora Michael APK
        run: gradle :scanner:assembleDebug --no-daemon

      - name: Upload Bora Michael APK
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Michael-Hi-Hi-debug
          path: scanner/build/outputs/apk/debug/scanner-debug.apk
          if-no-files-found: error
