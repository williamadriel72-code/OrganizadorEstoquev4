name: Build Bora Michael APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/scanner-build.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Bora Michael assets
        shell: bash
        run: |
          set -e
          mkdir -p scanner/src/main/res/mipmap-xxxhdpi
          mkdir -p scanner/src/main/res/drawable-nodpi
          mkdir -p scanner/src/main/res/raw
          mkdir -p scanner/src/main/assets

          curl -fsSL "https://bora-michael-assets.vercel.app/icon.b64" -o /tmp/bora-icon.b64
          cp scanner/assets/sticker_tiny.b64 /tmp/sticker.b64
          cat scanner/assets/heehee_v24_1.b64 scanner/assets/heehee_v24_2.b64 scanner/assets/heehee_v24_3.b64 > /tmp/heehee.b64
          cat scanner/assets/bora_web/part_*.txt > scanner/src/main/assets/bora_fallback.html
          cp scanner/assets/bora_web/patch_gps_panel_v26.js scanner/src/main/assets/gps_panel.js

          python3 - <<'PY'
          import base64, pathlib, re
          items = [
              ('/tmp/bora-icon.b64', 'scanner/src/main/res/mipmap-xxxhdpi/ic_launcher.png'),
              ('/tmp/sticker.b64', 'scanner/src/main/res/drawable-nodpi/michael_sticker.webp'),
              ('/tmp/heehee.b64', 'scanner/src/main/res/raw/heehee.ogg'),
          ]
          for src, dst in items:
              raw = pathlib.Path(src).read_text(errors='ignore')
              clean = ''.join(re.findall(r'[A-Za-z0-9+/=]', raw))
              clean += '=' * (-len(clean) % 4)
              data = base64.b64decode(clean, validate=False)
              pathlib.Path(dst).write_bytes(data)
              print(src, 'base64=', len(clean), 'bytes=', len(data), '->', dst)

          html_path = pathlib.Path('scanner/src/main/assets/bora_fallback.html')
          html = html_path.read_text(errors='strict')
          patch_files = [
              'scanner/assets/bora_web/patch_arrival_v1.js',
              'scanner/assets/bora_web/patch_arrival_rules_v2.js',
              'scanner/assets/bora_web/patch_menu_v1.js',
              'scanner/assets/bora_web/patch_rider_notes_v3.js',
          ]
          patch = '\n'.join(pathlib.Path(p).read_text(errors='strict') for p in patch_files)
          marker = '\nboot();\n'
          assert marker in html, 'fallback sem ponto de injeção'
          html = html.replace(marker, '\n' + patch + '\nboot();\n', 1)
          html_path.write_text(html)
          assert '<!doctype html' in html.lower(), 'fallback sem doctype'
          assert '</html>' in html.lower(), 'fallback incompleto'
          print('fallback html bytes=', len(html.encode()))
          PY

          file scanner/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file scanner/src/main/res/drawable-nodpi/michael_sticker.webp
          file scanner/src/main/res/raw/heehee.ogg
          test "$(wc -c < scanner/src/main/res/mipmap-xxxhdpi/ic_launcher.png)" -gt 4000
          test "$(wc -c < scanner/src/main/res/drawable-nodpi/michael_sticker.webp)" -gt 2000
          test "$(wc -c < scanner/src/main/res/raw/heehee.ogg)" -gt 10000
          test "$(wc -c < scanner/src/main/assets/bora_fallback.html)" -gt 45000
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 scanner/src/main/res/raw/heehee.ogg
          fi

      - name: Build Bora Michael release
        run: gradle :scanner:assembleRelease --no-daemon

      - name: Sign Bora Michael with permanent key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bora-signing scanner/build/outputs/apk/signed

          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bora-michael-signing-v1")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          KEY_JSON="$(curl -fsSL -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/bora-signing-key")"
          printf '%s' "$KEY_JSON" > /tmp/bora-signing/key.json

          python3 - <<'PY'
          import base64, json, pathlib
          data=json.loads(pathlib.Path('/tmp/bora-signing/key.json').read_text())
          assert data.get('ok') is True, data.get('error','signing key unavailable')
          pathlib.Path('/tmp/bora-signing/bora-michael.p12').write_bytes(base64.b64decode(data['keystore_b64']))
          pathlib.Path('/tmp/bora-signing/storepass').write_text(data['store_password'])
          pathlib.Path('/tmp/bora-signing/keypass').write_text(data['key_password'])
          pathlib.Path('/tmp/bora-signing/alias').write_text(data['key_alias'])
          print('Permanent signing key loaded:', data['cert_sha256'])
          PY

          STOREPASS="$(cat /tmp/bora-signing/storepass)"
          KEYPASS="$(cat /tmp/bora-signing/keypass)"
          ALIAS="$(cat /tmp/bora-signing/alias)"
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"

          UNSIGNED="scanner/build/outputs/apk/release/scanner-release-unsigned.apk"
          test -f "$UNSIGNED"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ALIGNED="/tmp/bora-signing/bora-aligned.apk"
          SIGNED="scanner/build/outputs/apk/signed/Bora-Michael-Hi-Hi-v2.8.1-ORIGINAL-GPS.apk"

          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign             --ks /tmp/bora-signing/bora-michael.p12             --ks-type PKCS12             --ks-key-alias "$ALIAS"             --ks-pass "pass:$STOREPASS"             --key-pass "pass:$KEYPASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          rm -rf /tmp/bora-signing

      - name: Upload Bora Michael APK
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Michael-Hi-Hi-v2.8.1-ORIGINAL-GPS
          path: scanner/build/outputs/apk/signed/Bora-Michael-Hi-Hi-v2.8.1-ORIGINAL-GPS.apk
          if-no-files-found: error
