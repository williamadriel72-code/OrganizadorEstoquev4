name: Build Multi Figurinhas APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner-build.yml'

permissions:
  contents: write

jobs:
  build-multifigurinhas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        id: apk_build
        shell: bash
        run: |
          set +e
          gradle :scanner:assembleDebug --stacktrace --no-daemon 2>&1 | tee multifigurinhas-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload APK artifact
        if: steps.apk_build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: MultiFigurinhas-debug
          path: scanner/build/outputs/apk/debug/scanner-debug.apk
          if-no-files-found: error

      - name: Upload failure log
        if: steps.apk_build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: MultiFigurinhas-build-log
          path: multifigurinhas-build.log

      - name: Fail if build failed
        if: steps.apk_build.outputs.status != '0'
        run: exit 1
