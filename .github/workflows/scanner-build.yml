name: Build Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/scanner-build.yml'

jobs:
  build-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Fruit Guard detector
        run: |
          mkdir -p /tmp/fruit-guard-tests
          javac -d /tmp/fruit-guard-tests \
            scanner/src/main/java/com/autoclicker/android/FruitNinjaLogic.java \
            scanner/src/main/java/com/autoclicker/android/FruitNinjaDetector.java \
            scanner/test-tools/FruitNinjaLogicSelfTest.java \
            scanner/test-tools/FruitNinjaStressTest.java
          java -cp /tmp/fruit-guard-tests com.autoclicker.android.FruitNinjaLogicSelfTest
          java -cp /tmp/fruit-guard-tests com.autoclicker.android.FruitNinjaStressTest

      - name: Android Lint
        run: gradle :scanner:lintDebug --no-daemon

      - name: Build Scanner APK
        run: gradle :scanner:assembleDebug --no-daemon

      - name: Upload Scanner APK
        uses: actions/upload-artifact@v4
        with:
          name: ScannerOrganizador-USB-debug
          path: scanner/build/outputs/apk/debug/scanner-debug.apk
          if-no-files-found: error
