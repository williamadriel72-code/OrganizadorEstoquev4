name: Build AWS Bora Michael TESTE

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
    paths:
      - ".github/workflows/aws-bora-michael-test.yml"
      - "app/src/main/assets/index.html"
      - "app/src/main/assets/bora_auto_update.js"
      - "build_trigger_aws_bora_test.txt"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar ferramentas Android e Apktool moderno
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" \
            -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Baixar APK AWS base 5.1.5
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/williamadriel72-code/OrganizadorEstoquev4/releases/download/v5.1.5/AWS-Gestao-Estoque-5.1.5.apk" \
            -o "$RUNNER_TEMP/aws-base.apk"

      - name: Decodificar APK e integrar Bora Michael
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/aws-bora-decoded"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "$RUNNER_TEMP/aws-base.apk" -o "$WORK"
          cp app/src/main/assets/index.html "$WORK/assets/index.html"
          cp app/src/main/assets/bora_auto_update.js "$WORK/assets/bora_auto_update.js"
          python - <<'PY'
          from pathlib import Path
          import os,re
          work=Path(os.environ['RUNNER_TEMP'])/'aws-bora-decoded'
          idx=work/'assets/index.html'
          s=idx.read_text(encoding='utf-8')
          if 'bora_auto_update.js' not in s:
              s=s.replace('</body>', '<script src="bora_auto_update.js"></script>\n</body>')
          idx.write_text(s,encoding='utf-8')
          y=work/'apktool.yml'
          t=y.read_text(encoding='utf-8')
          t=re.sub(r'(?m)^(\s*versionCode:\s*).+$', r'\g<1>50018', t, count=1)
          t=re.sub(r'(?m)^(\s*versionName:\s*).+$', r'\g<1>5.1.7-bora-test', t, count=1)
          y.write_text(t,encoding='utf-8')
          PY
          grep -q "AWS • Bora Michael" "$WORK/assets/index.html"
          grep -q "bora_auto_update.js" "$WORK/assets/index.html"
          grep -q "latest-app-version" "$WORK/assets/bora_auto_update.js"

      - name: Reconstruir APK com nova versao
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" b "$RUNNER_TEMP/aws-bora-decoded" -o "$RUNNER_TEMP/aws-bora-unsigned.apk"

      - name: Obter chave permanente de assinatura
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aws-apk-signing")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | jq -r '.value')
          SIGNING_JSON=$(curl -fsSL -H "Authorization: Bearer ${OIDC_TOKEN}" "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/github-apk-signing")
          STORE_PASS=$(echo "$SIGNING_JSON" | jq -r '.store_password')
          KEY_ALIAS=$(echo "$SIGNING_JSON" | jq -r '.key_alias')
          KEY_PASS=$(echo "$SIGNING_JSON" | jq -r '.key_password')
          echo "$SIGNING_JSON" | jq -r '.keystore_base64' | base64 -d > "$RUNNER_TEMP/aws-estoque-release.jks"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aws-estoque-release.jks" >> "$GITHUB_ENV"

      - name: Alinhar, assinar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/release
          ALIGNED="$RUNNER_TEMP/aws-bora-aligned.apk"
          SIGNED="app/build/outputs/apk/release/AWS-Bora-Michael-TESTE-v3.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/aws-bora-unsigned.apk" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$SIGNED" | head -n 2 | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='50018'" "$RUNNER_TEMP/badging.txt"
          unzip -p "$SIGNED" assets/index.html | grep -q "bora_auto_update.js"
          unzip -p "$SIGNED" assets/bora_auto_update.js | grep -q "FALLBACK_BUILD_CODE = 50018"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWS-Bora-Michael-TESTE-v3
          path: app/build/outputs/apk/release/AWS-Bora-Michael-TESTE-v3.apk
          if-no-files-found: error

      - name: Publicar APK de teste v3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AWS-Bora-Michael-TESTE-v3.apk"
          TAG="aws-bora-test-v3"
          ASSET="AWS-Bora-Michael-TESTE-v3.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "AWS + Bora Michael TESTE v3" --notes "Bora Michael com verificação automática de atualização logo ao abrir, antes de qualquer login ou seleção de motoboy."
          fi
          gh release delete-asset "$TAG" "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload "$TAG" "$APK"
