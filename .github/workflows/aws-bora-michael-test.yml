name: Build AWS Bora Michael TESTE

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
    paths:
      - ".github/workflows/aws-bora-michael-test.yml"
      - "app/src/main/assets/index.html"
      - "build_trigger_aws_bora_test.txt"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar ferramentas Android
        run: sdkmanager "build-tools;36.0.0"

      - name: Baixar APK AWS base 5.1.5
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/williamadriel72-code/OrganizadorEstoquev4/releases/download/v5.1.5/AWS-Gestao-Estoque-5.1.5.apk" \
            -o "$RUNNER_TEMP/aws-base.apk"
          cp "$RUNNER_TEMP/aws-base.apk" "$RUNNER_TEMP/aws-bora-unsigned.apk"

      - name: Integrar interface Bora Michael no APK AWS
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/aws-bora-patch"
          mkdir -p "$WORK/assets"
          cp app/src/main/assets/index.html "$WORK/assets/index.html"
          cd "$RUNNER_TEMP"
          zip -d aws-bora-unsigned.apk 'META-INF/*' 'assets/index.html' >/dev/null 2>&1 || true
          cd "$WORK"
          zip -q -u "$RUNNER_TEMP/aws-bora-unsigned.apk" assets/index.html
          unzip -p "$RUNNER_TEMP/aws-bora-unsigned.apk" assets/index.html | grep -q "AWS • Bora Michael"

      - name: Obter chave permanente de assinatura
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aws-apk-signing")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | jq -r '.value')
          SIGNING_JSON=$(curl -fsSL -H "Authorization: Bearer ${OIDC_TOKEN}" "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/github-apk-signing")
          STORE_PASS=$(echo "$SIGNING_JSON" | jq -r '.store_password')
          KEY_ALIAS=$(echo "$SIGNING_JSON" | jq -r '.key_alias')
          KEY_PASS=$(echo "$SIGNING_JSON" | jq -r '.key_password')
          echo "$SIGNING_JSON" | jq -r '.keystore_base64' | base64 -d > "$RUNNER_TEMP/aws-estoque-release.jks"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aws-estoque-release.jks" >> "$GITHUB_ENV"

      - name: Alinhar e assinar APK de teste
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/release
          ALIGNED="$RUNNER_TEMP/aws-bora-aligned.apk"
          SIGNED="app/build/outputs/apk/release/AWS-Bora-Michael-TESTE-v1.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/aws-bora-unsigned.apk" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          unzip -p "$SIGNED" assets/index.html | grep -q "Rota no Google Maps"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWS-Bora-Michael-TESTE-v1
          path: app/build/outputs/apk/release/AWS-Bora-Michael-TESTE-v1.apk
          if-no-files-found: error

      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AWS-Bora-Michael-TESTE-v1.apk"
          TAG="aws-bora-test-v1"
          ASSET="AWS-Bora-Michael-TESTE-v1.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "AWS + Bora Michael TESTE v1" --notes "APK AWS reaproveitado como ambiente de teste do Bora Michael: pedidos despachados, bairro, taxa, ganhos, mapa e conclusão."
          fi
          gh release delete-asset "$TAG" "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload "$TAG" "$APK"
