name: Build Bora Michael TESTE Camera Safe v9

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
    paths:
      - ".github/workflows/aws-bora-michael-camera-v8.yml"
      - "app/src/main/java/com/organizador/estoque/LauncherActivity.kt"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/xml/update_file_paths.xml"
      - "app/src/main/assets/index.html"
      - "app/src/main/assets/bora_auto_update.js"
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compilar release
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Mesclar camera na base estavel v7
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/williamadriel72-code/OrganizadorEstoquev4/releases/download/aws-bora-online-v7/AWS-Bora-Michael-ONLINE-v7.apk" -o "$RUNNER_TEMP/bora-v7.apk"
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "$RUNNER_TEMP/bora-v7.apk" -o "$RUNNER_TEMP/base"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f app/build/outputs/apk/release/app-release-unsigned.apk -o "$RUNNER_TEMP/src"
          python - <<'PY'
          from pathlib import Path
          import os,re,shutil
          base=Path(os.environ['RUNNER_TEMP'])/'base'
          src=Path(os.environ['RUNNER_TEMP'])/'src'
          for root in base.glob('smali*'):
              p=root/'com/organizador/estoque'
              if p.exists():
                  for x in p.glob('LauncherActivity*.smali'):
                      x.unlink()
          copied=0
          for root in src.glob('smali*'):
              p=root/'com/organizador/estoque'
              if not p.exists():
                  continue
              files=list(p.glob('LauncherActivity*.smali'))
              if not files:
                  continue
              dest=base/root.name/'com/organizador/estoque'
              dest.mkdir(parents=True,exist_ok=True)
              for x in files:
                  shutil.copy2(x,dest/x.name)
                  copied+=1
          if copied == 0:
              raise SystemExit('LauncherActivity smali nao encontrada')
          sx=src/'res/xml/update_file_paths.xml'
          if sx.exists():
              shutil.copy2(sx,base/'res/xml/update_file_paths.xml')
          y=base/'apktool.yml'
          t=y.read_text(encoding='utf-8')
          t=re.sub(r'(?m)^(\s*versionCode:\s*).+
      - name: Obter chave permanente
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aws-apk-signing")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | jq -r '.value')
          SIGNING_JSON=$(curl -fsSL -H "Authorization: Bearer ${OIDC_TOKEN}" "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/github-apk-signing")
          STORE_PASS=$(echo "$SIGNING_JSON" | jq -r '.store_password')
          KEY_ALIAS=$(echo "$SIGNING_JSON" | jq -r '.key_alias')
          KEY_PASS=$(echo "$SIGNING_JSON" | jq -r '.key_password')
          echo "$SIGNING_JSON" | jq -r '.keystore_base64' | base64 -d > "$RUNNER_TEMP/aws-estoque-release.jks"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aws-estoque-release.jks" >> "$GITHUB_ENV"

      - name: Alinhar assinar e validar
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$RUNNER_TEMP/bora-v9-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/bora-v8-aligned.apk"
          SIGNED="app/build/outputs/apk/release/AWS-Bora-Michael-ONLINE-v9.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$SIGNED" | head -n 2 | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='50024'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='5.2.3-camera-safe'" "$RUNNER_TEMP/badging.txt"
          unzip -p "$SIGNED" assets/index.html | grep -q "bora-michael-motoboy-vqz606.v2.appdeploy.ai"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWS-Bora-Michael-ONLINE-v9
          path: app/build/outputs/apk/release/AWS-Bora-Michael-ONLINE-v9.apk
          if-no-files-found: error

      - name: Publicar APK v8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AWS-Bora-Michael-ONLINE-v9.apk"
          TAG="aws-bora-online-v9"
          ASSET="AWS-Bora-Michael-ONLINE-v9.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target aws-supabase-apk-v1 --title "Bora Michael ONLINE v9" --notes "Correcao de inicializacao: base estavel v7 com suporte nativo de camera/galeria para leitura de endereco."
          fi
          gh release delete-asset "$TAG" "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload "$TAG" "$APK"
, r'\g<1>50024', t, count=1)
          t=re.sub(r'(?m)^(\s*versionName:\s*).+
      - name: Obter chave permanente
        shell: bash
        run: |
