name: Build Bora Michael TESTE GPS v11

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
    paths:
      - ".github/workflows/aws-bora-michael-camera-v8.yml"
      - "app/src/main/java/com/organizador/estoque/LauncherActivity.kt"
      - "app/src/main/res/xml/update_file_paths.xml"
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" -o "$RUNNER_TEMP/apktool.jar"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compilar suporte GPS atual
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Baixar base estável v10
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/williamadriel72-code/OrganizadorEstoquev4/releases/download/aws-bora-online-v10/Bora-Michael-TESTE-v10.apk" -o "$RUNNER_TEMP/base-v10.apk"

      - name: Mesclar GPS na base estável
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/base"
          SRC="$RUNNER_TEMP/src"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "$RUNNER_TEMP/base-v10.apk" -o "$BASE"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f app/build/outputs/apk/release/app-release-unsigned.apk -o "$SRC"

          find "$BASE" -path '*/com/organizador/estoque/LauncherActivity*.smali' -delete

          COPIED=0
          while IFS= read -r SRCFILE; do
            REL="${SRCFILE#"$SRC"/}"
            DEST="$BASE/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$SRCFILE" "$DEST"
            COPIED=$((COPIED+1))
          done < <(find "$SRC" -path '*/com/organizador/estoque/LauncherActivity*.smali' -type f)

          if [ "$COPIED" -eq 0 ]; then
            echo "LauncherActivity não encontrada"
            exit 1
          fi

          if [ -f "$SRC/res/xml/update_file_paths.xml" ]; then
            cp "$SRC/res/xml/update_file_paths.xml" "$BASE/res/xml/update_file_paths.xml"
          fi

          python - <<'PY'
          from pathlib import Path
          import os,re
          base=Path(os.environ['RUNNER_TEMP'])/'base'
          y=base/'apktool.yml'
          t=y.read_text(encoding='utf-8')
          t=re.sub(r'(?m)^(\s*versionCode:\s*).+$', r'\g<1>50026', t, count=1)
          t=re.sub(r'(?m)^(\s*versionName:\s*).+$', r'\g<1>5.2.5-gps', t, count=1)
          y.write_text(t, encoding='utf-8')

          manifest=base/'AndroidManifest.xml'
          mt=manifest.read_text(encoding='utf-8')
          mt=re.sub(r'android:label="[^"]+"', 'android:label="Bora Michael TESTE"', mt, count=1)
          for permission in (
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
          ):
              marker=f'android:name="{permission}"'
              if marker not in mt:
                  mt=mt.replace(
                      '<application',
                      f'<uses-permission android:name="{permission}" />\n    <application',
                      1,
                  )
          manifest.write_text(mt, encoding='utf-8')
          PY

          java -jar "$RUNNER_TEMP/apktool.jar" b "$BASE" -o "$RUNNER_TEMP/bora-v11-unsigned.apk"

      - name: Obter chave permanente
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aws-apk-signing")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | jq -r '.value')
          SIGNING_JSON=$(curl -fsSL -H "Authorization: Bearer ${OIDC_TOKEN}" "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/github-apk-signing")
          STORE_PASS=$(echo "$SIGNING_JSON" | jq -r '.store_password')
          KEY_ALIAS=$(echo "$SIGNING_JSON" | jq -r '.key_alias')
          KEY_PASS=$(echo "$SIGNING_JSON" | jq -r '.key_password')
          echo "$SIGNING_JSON" | jq -r '.keystore_base64' | base64 -d > "$RUNNER_TEMP/aws-estoque-release.jks"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aws-estoque-release.jks" >> "$GITHUB_ENV"

      - name: Assinar e validar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/release
          ALIGNED="$RUNNER_TEMP/bora-v11-aligned.apk"
          SIGNED="app/build/outputs/apk/release/Bora-Michael-TESTE-v11.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/bora-v11-unsigned.apk" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$SIGNED" | head -n 2 | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='50026'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='5.2.5-gps'" "$RUNNER_TEMP/badging.txt"
          unzip -p "$SIGNED" assets/index.html | grep -q "bora-michael-motoboy-vqz606.v2.appdeploy.ai"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Michael-TESTE-v11
          path: app/build/outputs/apk/release/Bora-Michael-TESTE-v11.apk
          if-no-files-found: error

      - name: Publicar APK v11
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/Bora-Michael-TESTE-v11.apk"
          TAG="aws-bora-online-v11"
          ASSET="Bora-Michael-TESTE-v11.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target aws-supabase-apk-v1 --title "Bora Michael TESTE v11 GPS" --notes "Adiciona permissão nativa de localização para o GPS do motoboy no APK TESTE. A interface online envia a posição ao Painel TESTE enquanto o aplicativo está aberto, mantendo as funções MultiFoto e rotas da v10."
          fi
          gh release delete-asset "$TAG" "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload "$TAG" "$APK"
