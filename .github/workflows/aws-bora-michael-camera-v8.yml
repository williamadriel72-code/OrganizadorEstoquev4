name: Build Bora Michael TESTE Camera Safe v9

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
    paths:
      - ".github/workflows/aws-bora-michael-camera-v8.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" -o "$RUNNER_TEMP/apktool.jar"

      - name: Baixar bases v7 e v8
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/williamadriel72-code/OrganizadorEstoquev4/releases/download/aws-bora-online-v7/AWS-Bora-Michael-ONLINE-v7.apk" -o "$RUNNER_TEMP/v7.apk"
          curl -fL --retry 3 "https://github.com/williamadriel72-code/OrganizadorEstoquev4/releases/download/aws-bora-online-v8/AWS-Bora-Michael-ONLINE-v8.apk" -o "$RUNNER_TEMP/v8.apk"

      - name: Mesclar somente suporte de camera na base estavel
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/base"
          CAM="$RUNNER_TEMP/cam"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "$RUNNER_TEMP/v7.apk" -o "$BASE"
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "$RUNNER_TEMP/v8.apk" -o "$CAM"

          find "$BASE" -path '*/com/organizador/estoque/LauncherActivity*.smali' -delete

          COPIED=0
          while IFS= read -r SRC; do
            REL="${SRC#"$CAM"/}"
            DEST="$BASE/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$SRC" "$DEST"
            COPIED=$((COPIED+1))
          done < <(find "$CAM" -path '*/com/organizador/estoque/LauncherActivity*.smali' -type f)

          if [ "$COPIED" -eq 0 ]; then
            echo "LauncherActivity nao encontrada"
            exit 1
          fi

          if [ -f "$CAM/res/xml/update_file_paths.xml" ]; then
            cp "$CAM/res/xml/update_file_paths.xml" "$BASE/res/xml/update_file_paths.xml"
          fi

          python - <<'PY'
          from pathlib import Path
          import os,re
          y=Path(os.environ['RUNNER_TEMP'])/'base'/'apktool.yml'
          t=y.read_text(encoding='utf-8')
          t=re.sub(r'(?m)^(\s*versionCode:\s*).+$', r'\g<1>50024', t, count=1)
          t=re.sub(r'(?m)^(\s*versionName:\s*).+$', r'\g<1>5.2.3-camera-safe', t, count=1)
          y.write_text(t, encoding='utf-8')
          PY

          java -jar "$RUNNER_TEMP/apktool.jar" b "$BASE" -o "$RUNNER_TEMP/bora-v9-unsigned.apk"

      - name: Obter chave permanente
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aws-apk-signing")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | jq -r '.value')
          SIGNING_JSON=$(curl -fsSL -H "Authorization: Bearer ${OIDC_TOKEN}" "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/github-apk-signing")
          STORE_PASS=$(echo "$SIGNING_JSON" | jq -r '.store_password')
          KEY_ALIAS=$(echo "$SIGNING_JSON" | jq -r '.key_alias')
          KEY_PASS=$(echo "$SIGNING_JSON" | jq -r '.key_password')
          echo "$SIGNING_JSON" | jq -r '.keystore_base64' | base64 -d > "$RUNNER_TEMP/aws-estoque-release.jks"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aws-estoque-release.jks" >> "$GITHUB_ENV"

      - name: Assinar e validar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/release
          ALIGNED="$RUNNER_TEMP/bora-v9-aligned.apk"
          SIGNED="app/build/outputs/apk/release/AWS-Bora-Michael-ONLINE-v9.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/bora-v9-unsigned.apk" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$SIGNED" | head -n 2 | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='50024'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='5.2.3-camera-safe'" "$RUNNER_TEMP/badging.txt"
          unzip -p "$SIGNED" assets/index.html | grep -q "bora-michael-motoboy-vqz606.v2.appdeploy.ai"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWS-Bora-Michael-ONLINE-v9
          path: app/build/outputs/apk/release/AWS-Bora-Michael-ONLINE-v9.apk
          if-no-files-found: error

      - name: Publicar APK v9
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AWS-Bora-Michael-ONLINE-v9.apk"
          TAG="aws-bora-online-v9"
          ASSET="AWS-Bora-Michael-ONLINE-v9.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target aws-supabase-apk-v1 --title "Bora Michael ONLINE v9" --notes "Correcao de inicializacao. Usa a mesma base estavel da v7 e adiciona somente o suporte nativo de camera/galeria."
          fi
          gh release delete-asset "$TAG" "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload "$TAG" "$APK"
