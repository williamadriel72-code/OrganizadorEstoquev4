name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OrganizadorEstoquePC desktop/app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OrganizadorEstoquePC-Windows
          path: dist/OrganizadorEstoquePC.exe
          if-no-files-found: error
