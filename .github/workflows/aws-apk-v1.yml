name: Build AWS Estoque APK

on:
  push:
    branches: [ "aws-supabase-apk-v1" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar estoque geral sem filial
        run: python scripts/prepare_single_stock.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build unsigned release
        run: gradle :app:assembleRelease --stacktrace

      - name: Obtain permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aws-apk-signing")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | jq -r '.value')
          SIGNING_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://rlgsbtolosxyymosidns.supabase.co/functions/v1/github-apk-signing")

          STORE_PASS=$(echo "$SIGNING_JSON" | jq -r '.store_password')
          KEY_ALIAS=$(echo "$SIGNING_JSON" | jq -r '.key_alias')
          KEY_PASS=$(echo "$SIGNING_JSON" | jq -r '.key_password')
          echo "$SIGNING_JSON" | jq -r '.keystore_base64' | base64 -d > "$RUNNER_TEMP/aws-estoque-release.jks"

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aws-estoque-release.jks" >> "$GITHUB_ENV"

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/AWS-Gestao-Estoque-5.0.3.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AWS-Gestao-Estoque-v5.0.3-signed
          path: app/build/outputs/apk/release/AWS-Gestao-Estoque-5.0.3.apk
          if-no-files-found: error

      - name: Publicar release fixa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AWS-Gestao-Estoque-5.0.3.apk"
          ASSET="AWS-Gestao-Estoque-5.0.3.apk"
          TAG="v5.0.3"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "AWS Gestão de Estoque 5.0.3" \
              --notes "Estoque geral sem filial, importação de produtos e validades, assinatura permanente e atualização centralizada."
          fi
          gh release delete-asset "$TAG" "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload "$TAG" "$APK"
